<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost SMP</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700;900&display=swap" rel="stylesheet">
    <style>
        /* Сброс стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #050505;
            overflow: hidden;
        }

        /* Фон с облаками (используем твое фото как фон) */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Сюда вставь путь к своему фото, если оно у тебя есть. 
               Пока я использую прямую ссылку на похожее мрачное небо из сети */
            background-image: url('https://images.unsplash.com/photo-1534088568595-a066f410cbda?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: brightness(0.4) contrast(1.5) grayscale(0.8);
            z-index: 1;
        }

        /* Затемняющий градиент для лучшей читаемости текста */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%);
            z-index: 2;
        }

        /* Контейнер для контента */
        .content {
            position: relative;
            z-index: 3;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            padding-bottom: 70px; /* место для блока владельцев внизу */
        }

        /* Заголовок с эффектом свечения как на фото */
        h1 {
            color: #ffffff;
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 15px;
            text-shadow: 
                0 0 20px rgba(255, 255, 255, 0.4),
                0 0 60px rgba(255, 255, 255, 0.2),
                0 0 100px rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
            animation: fadeIn 2s ease-in-out;
        }

        /* Подзаголовок (измененный текст) */
        p {
            color: #a0a0a0;
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 50px;
            text-transform: uppercase;
            animation: fadeIn 2.5s ease-in-out;
        }

        /* Красивая кнопка со ссылкой на Discord */
        .btn {
            display: inline-block;
            padding: 18px 45px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            border-radius: 5px;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            animation: fadeIn 3s ease-in-out;
            margin-bottom: 30px;
        }

        /* Эффект при наведении на кнопку */
        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffffff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }

        /* Блок с описанием (одно, под кнопкой) */
        .description {
            color: #c0c0c0;
            font-size: 1.05rem;
            font-weight: 300;
            line-height: 1.7;
            letter-spacing: 1px;
            max-width: 700px;
            animation: fadeIn 3.3s ease-in-out;
        }

        .description span {
            color: #ffffff;
            font-weight: 700;
        }

        /* Блок владельцев — в самом низу */
        .owners {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #888888;
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: fadeIn 3.6s ease-in-out;
            z-index: 3;
        }

        .owners span {
            color: #ffffff;
            font-weight: 700;
        }

        /* Анимация появления */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Адаптация под телефоны */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
                letter-spacing: 8px;
            }
            p {
                font-size: 0.9rem;
                letter-spacing: 1px;
                margin-bottom: 30px;
            }
            .description {
                font-size: 0.9rem;
                letter-spacing: 0.5px;
            }
            .btn {
                padding: 15px 30px;
                font-size: 1rem;
            }
            .owners {
                font-size: 0.8rem;
                letter-spacing: 1px;
                bottom: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Фон -->
    <div class="background"></div>
    <div class="overlay"></div>

    <!-- Контент -->
    <div class="content">
        <h1>Ghost SMP</h1>
        <p>мы ждём тебя в дс канале</p>
        
        <!-- Твоя ссылка на Discord -->
        <a href="https://discord.gg/EZdVXFneE" target="_blank" class="btn">
            Зайди в дс канал
        </a>

        <!-- Описание (одно, под кнопкой) -->
        <div class="description">
            Это <span>ванила SMP</span>, открытие которого состоится <span>15.11.2026</span>.
            Здесь ты можешь стать <span>трапером</span> или <span>топ 1 игроком</span> на Ghost SMP.
        </div>
    </div>

    <!-- Владельцы — в самом низу страницы -->
    <div class="owners">
        Владельцы: <span>geni</span>, <span>Захарка</span> и <span>Тимур</span>
    </div>

</body>
</html>
